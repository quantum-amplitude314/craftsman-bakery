name: craftsman-bakery
services:
  postgres-dev:
    image: docker.io/library/postgres:19-alpine
    container_name: craftsman-bakery-pg-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: craftsman_bakery
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "craftsman_bakery"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5435:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql
  postgres-test:
    image: docker.io/library/postgres:19-alpine
    container_name: craftsman-bakery-pg-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: craftsman_bakery_test
    healthcheck:
      test:
        ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "craftsman_bakery_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5436:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql
volumes:
  pgdata-dev:
  pgdata-test:
